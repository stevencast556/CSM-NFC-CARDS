<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta Privada</title>
    
    <!-- PDF.js (Gratis) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        /* Estilos Generales */
        :root { --bg: #1a1a1a; --card: #252525; --accent: #3498db; }
        body { font-family: sans-serif; background-color: var(--bg); color: white; margin: 0; overflow-x: hidden; }

        /* Login */
        #login-screen {
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .login-card {
            background: var(--card); padding: 40px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 320px; text-align: center;
        }
        input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #444; background: #333; color: white; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background: var(--accent); color: white;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }

        /* Visor de PDF */
        #viewer-screen { display: none; padding: 20px; }
        #pdf-main-container { display: flex; flex-direction: column; align-items: center; position: relative; }
        canvas { margin-bottom: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.7); max-width: 100%; z-index: 5; }

        /* Marca de Agua Dinámica */
        #watermark-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; opacity: 0.4;
            display: flex; flex-wrap: wrap; justify-content: space-around; align-content: space-around;
        }
        .wm-item { transform: rotate(-45deg); font-size: 16px; color: white; text-align: center; margin: 50px; }

        /* BLOQUEO DE IMPRESIÓN (CSS) */
        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- PANTALLA 1: LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Acceso Seguro</h2>
            <p style="color: #888; font-size: 0.9em;">Ingrese sus credenciales</p>
            <input type="text" id="userInput" placeholder="Usuario">
            <input type="password" id="passInput" placeholder="Contraseña">
            <button onclick="handleLogin()">INGRESAR</button>
        </div>
    </div>

    <!-- PANTALLA 2: VISOR -->
    <div id="viewer-screen">
        <div id="watermark-overlay"></div>
        <div id="pdf-main-container"></div>
    </div>

        // ==========================================
        function handleLogin() {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;

            if(u === CONFIG.validUser && p === CONFIG.validPass) {
                // Registrar en Google Forms
                registrarAcceso(u);
                
                // Cambiar pantalla
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('viewer-screen').style.display = 'block';
                
                // Iniciar PDF y Marca de Agua
                crearMarcaAgua(u);
                cargarPDF();
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        }

        function registrarAcceso(nombre) {
            const timestamp = new Date().toLocaleString();
            const logData = `Usuario: ${nombre} | Fecha: ${timestamp}`;
            const finalURL = `${CONFIG.googleFormURL}?${CONFIG.googleEntryID}=${encodeURIComponent(logData)}`;
            
            // Envío silencioso
            fetch(finalURL, { mode: 'no-cors', method: 'POST' });
        }

        // ==========================================
        // 3. LÓGICA DEL VISOR PDF
        // ==========================================
        async function cargarPDF() {
            const pdfData = atob(CONFIG.pdfBase64); // Decodifica el texto a PDF
            const pdfjsLib = window['pdfjs-dist/build/pdf'];
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

            try {
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                const pdf = await loadingTask.promise;
                const container = document.getElementById('pdf-main-container');

                for (let n = 1; n <= pdf.numPages; n++) {
                    const page = await pdf.getPage(n);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    container.appendChild(canvas);

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                }
            } catch (e) {
                console.error("Error cargando PDF:", e);
                alert("Error al procesar el documento.");
            }
        }

        function crearMarcaAgua(nombre) {
            const overlay = document.getElementById('watermark-overlay');
            const info = `${nombre} - ${new Date().toLocaleDateString()}`;
            for(let i=0; i<30; i++) {
                const div = document.createElement('div');
                div.className = 'wm-item';
                div.innerHTML = `CONFIDENCIAL<br>${info}`;
                overlay.appendChild(div);
            }
        }

                (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u' || e.key === 'c')) ||
                e.key === 'F12'
            ) {
                e.preventDefault();
                alert("Acción no permitida por seguridad.");
                return false;
            }
        });
    </script>
</body>
</html>
