<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta Privada - Daledigital</title>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        :root { --bg: #1a1a1a; --card: #252525; --accent: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: white; margin: 0; overflow-x: hidden; }

        /* Login */
        #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: var(--card); padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #2980b9; }

        /* Visor de PDF */
        #viewer-screen { display: none; padding: 20px; }
        #pdf-main-container { display: flex; flex-direction: column; align-items: center; position: relative; margin-top: 20px; }
        canvas {
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    background-color: white;
    /* Mejora el renderizado de bordes en el navegador */
    image-rendering: -webkit-optimize-contrast;
    image-rendering: auto;
}

        /* Marca de Agua Dinámica */
        #watermark-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; opacity: 0.5;
            display: flex; flex-wrap: wrap; justify-content: space-around; align-content: space-around;
        }
        .wm-item { transform: rotate(-45deg); font-size: 14px; color: Black; text-align: center; margin: 40px; white-space: nowrap; }

        #pdf-main-container {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
}
        
        /* Bloqueo de Impresión */
        @media print { body { display: none !important; } }
        
        /* Loading Spinner */
        #loader { display: none; color: var(--accent); margin: 20px; font-weight: bold; }
        #pdf-main-container {
    width: 100%;
    max-width: 900px; /* Tamaño máximo en PC para que no se vea gigante */
    margin: 0 auto;   /* Centrado */
    padding: 10px;
    box-sizing: border-box;
}

canvas {
    display: block;
    margin: 0 auto 20px auto; /* Centrar canvas y espacio abajo */
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    background-color: white;
}

/* Ajuste de marca de agua para móviles */
.wm-item {
    transform: rotate(-45deg);
    font-size: 12px; /* Más pequeña en móvil */
    opacity: 0.2;    /* Más transparente para que deje leer */
}

/* Media Query para pantallas grandes (PC) */
@media (max-width: 480px) {
    .login-card {
        width: 90%;
        padding: 20px;
    }
    input, button {
        padding: 15px; /* Más grandes para el dedo */
        font-size: 16px;
    }
}
        
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- PANTALLA 1: LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Acceso Seguro</h2>
            <p style="color: #888; font-size: 0.9em;">Ingrese sus credenciales</p>
            <input type="text" id="userInput" placeholder="Usuario">
            <input type="password" id="passInput" placeholder="Contraseña">
            <button onclick="handleLogin()">INGRESAR</button>
        </div>
    </div>

    <!-- PANTALLA 2: VISOR -->
    <div id="viewer-screen">
        <div style="text-align: center;">
            <h3 id="doc-title">Documento Confidencial</h3>
            <div id="loader">Procesando documento...</div>
            <!-- Opción por si quieres cargar un archivo diferente en el momento -->
            

        <div id="watermark-overlay"></div>
        <div id="pdf-main-container"></div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN
        // ==========================================
        const CONFIG = {
            validUser: "admin",
            validPass: "123",
            // CAMBIO CLAVE: Ya no usas Base64, solo el nombre del archivo que subas a tu hosting
            pdfURL: "mi_archivo.pdf", 
            googleFormURL: "https://docs.google.com/forms/d/e/1FAIpQLSeSN7_TwGat72UHjkw0lRdRfRYHIlkn2apP4iKYwdSkT1fL0Q/formResponse",
            googleEntryID: "entry.1875583792" 
        };

        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // ==========================================
        // 2. LÓGICA DE ACCESO
        // ==========================================
        function handleLogin() {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;

            if(u === CONFIG.validUser && p === CONFIG.validPass) {
                registrarAcceso(u);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('viewer-screen').style.display = 'block';
                
                crearMarcaAgua(u);
                // Intentar cargar el PDF por defecto
                cargarPDF(CONFIG.pdfURL);
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        }

        function registrarAcceso(nombre) {
            const timestamp = new Date().toLocaleString();
            const logData = `Usuario: ${nombre} | Fecha: ${timestamp}`;
            const finalURL = `${CONFIG.googleFormURL}?${CONFIG.googleEntryID}=${encodeURIComponent(logData)}`;
            fetch(finalURL, { mode: 'no-cors', method: 'POST' });
        }

        // ==========================================
        // 3. LÓGICA DEL VISOR (MEJORADA)
        // ==========================================
        
        // Cargar desde URL o Ruta
        async function cargarPDF(url) {
            if(!url) return;
            mostrarLoader(true);
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                renderizarPaginas(pdf);
            } catch (e) {
                console.error("Error:", e);
                // Si falla el archivo por defecto, el usuario puede subir uno con el input file
                alert("No se encontró el archivo predeterminado. Por favor, selecciónelo manualmente.");
            }
            mostrarLoader(false);
        }

        // Cargar desde el Selector de Archivos (Opcional por si quieres cambiar de PDF)
        document.getElementById('file-selector').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                mostrarLoader(true);
                const reader = new FileReader();
                reader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    const loadingTask = pdfjsLib.getDocument(typedarray);
                    const pdf = await loadingTask.promise;
                    renderizarPaginas(pdf);
                    mostrarLoader(false);
                };
                reader.readAsArrayBuffer(file);
            }
        });

        async function renderizarPaginas(pdf) {
    const container = document.getElementById('pdf-main-container');
    container.innerHTML = ''; 

    const dpr = window.devicePixelRatio || 1;
    
    // FORZAMOS UNA ESCALA ALTA (2.5) para nitidez absoluta.
    // Esto hace que PDF.js dibuje las letras con muchos más píxeles.
    const renderScale = 2.5; 

    for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        
        // El viewport se calcula con la escala de alta resolución
        const viewport = page.getViewport({ scale: renderScale });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        // 1. RESOLUCIÓN INTERNA: Multiplicamos por DPR para pantallas Retina/4K
        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);

        // 2. TAMAÑO VISUAL (CSS): 
        // En móviles será el 100% del ancho. En PC se limita para no ser gigante.
        canvas.style.width = "100%"; 
        canvas.style.maxWidth = "850px"; // Tamaño ideal de lectura en PC
        canvas.style.height = "auto";
        canvas.style.display = "block";
        canvas.style.margin = "0 auto 30px auto";

        // 3. COMPENSACIÓN DE ESCALA:
        // Ajustamos el contexto para que el dibujo no se vea "cortado" por el DPR
        context.scale(dpr, dpr);
        
        container.appendChild(canvas);

        const renderContext = {
            canvasContext: context,
            viewport: viewport,
            intent: 'display'
        };

        // Renderizar
        await page.render(renderContext).promise;
    }
}

        function mostrarLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }

        function crearMarcaAgua(nombre) {
            const overlay = document.getElementById('watermark-overlay');
            const info = `${nombre} - ${new Date().toLocaleDateString()}`;
            for(let i=0; i<40; i++) {
                const div = document.createElement('div');
                div.className = 'wm-item';
                div.innerHTML = `CONFIDENCIAL<br>${info}`;
                overlay.appendChild(div);
            }
        }

        // ==========================================
        // 4. BLOQUEOS DE SEGURIDAD
        // ==========================================
        document.addEventListener('keydown', function(e) {
            if (
                (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u' || e.key === 'c')) ||
                e.key === 'F12'
            ) {
                e.preventDefault();
                alert("Acción no permitida.");
            }
        });

        window.addEventListener('resize', () => {
    // Solo si el visor está activo, refrescamos para ajustar el tamaño
    if(document.getElementById('viewer-screen').style.display === 'block') {
        // Podrías llamar a una función que refresque la vista si es necesario
        // Aunque con canvas.style.width = "100%" ya debería ajustarse visualmente.
    }
});
    </script>
</body>
</html>
