<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steven Castillo - Tarjeta NFC</title>
    <style>
        /* RESET TOTAL PARA EVITAR DESPLAZAMIENTOS */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #3b82f6;
            --card-glass: rgba(255, 255, 255, 0.1);
            --border-glass: rgba(255, 255, 255, 0.2);
        }

        /* CUERPO CENTRADO DINÁMICO */
        body {
            /* Usamos dvh (Dynamic Viewport Height) para que siempre esté centrado en celular */
            height: 100vh;
            height: 100dvh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* Fondo base */
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            overflow: hidden; /* Evita que el fondo cree scroll innecesario */
            position: relative;
        }

        /* CAPA OSCURA DE CONTRASTE TOTALMENTE FIJA */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* TARJETA TOTALMENTE CENTRADA */
        .card {
            position: relative;
            z-index: 10; /* Por encima del overlay */
            width: 90%;
            max-width: 360px;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            /* Animación de entrada */
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ELEMENTOS INTERNOS */
        .profile-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 3px solid white;
            overflow: hidden;
            background: #222;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { font-size: 24px; margin-bottom: 6px; font-weight: 700; letter-spacing: -0.5px; }
        .profesion { color: #d1d5db; font-size: 14px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1.5px; }

        /* BOTONES */
        .btn-group { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
            border: none;
            display: block;
            width: 100%;
        }

        .btn-alt {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border-glass);
        }

        .btn:active { transform: scale(0.96); }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <div class="profile-container">
            <img id="img-perfil" src="" class="profile-img" alt="Steven">
        </div>

        <h1>Steven Castillo</h1>
        <p class="profesion">Ingeniero en Automatización</p>

        <div class="btn-group">
            <a href="tel:+593998002028" class="btn">Llamar ahora</a>
            <a href="https://wa.me/593998002028" class="btn btn-alt">WhatsApp</a>
            <a href="mailto:stevencast556@gmail.com" class="btn btn-alt">Enviar Correo</a>
            <button onclick="descargarVcard()" class="btn btn-alt" style="cursor:pointer;">Guardar Contacto</button>
        </div>
    </div>

    <script>
        /* 
           INSTRUCCIONES:
           Pega tus códigos Base64 dentro de las comillas.
           Asegúrate de que empiecen con "data:image/..."
        */

        
        const MI_FONDO_BASE64 = "";
        const MI_FOTO_BASE64 = "";

        // Función para aplicar imágenes sin descentrar nada
        window.addEventListener('load', () => {
            if(MI_FONDO_BASE64.length > 50) {
                document.body.style.backgroundImage = `url("${MI_FONDO_BASE64}")`;
            }
            if(MI_FOTO_BASE64.length > 50) {
                document.getElementById('img-perfil').src = MI_FOTO_BASE64;
            }
        });

        function descargarVcard() {
            const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:Steven Castillo\nTITLE:Ingeniero en Automatización\nTEL:+593998002028\nEND:VCARD";
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Steven_Castillo.vcf";
            a.click();
        }
    </script>
</body>
</html>
