<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steven Castillo - Tarjeta Digital</title>
    <style>
        /* RESET GENERAL */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }

        body {
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* Fondo base por si falla la imagen */
            background-size: cover;
            background-position: center;
            overflow: hidden;
            position: relative;
        }

        /* Capa de contraste */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        /* TARJETA CENTRADA */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 35px;
            padding: 40px 25px;
            text-align: center; /* Alinea texto al centro */
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }

        /* FOTO DE PERFIL CENTRADA */
        .profile-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px; /* Centra el círculo */
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #3b82f6, #00d4ff);
        }

        .profile-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid white;
            display: block;
        }

        h1 { font-size: 26px; margin-bottom: 6px; font-weight: 700; }
        .profesion { 
            color: #d1d5db; 
            font-size: 14px; 
            margin-bottom: 30px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }

        /* BOTONES ALINEADOS AL CENTRO */
        .btn-group { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center; /* ESTO CENTRA TODO EL CONTENIDO DEL BOTÓN */
            gap: 12px; /* Espacio entre icono y texto */
            padding: 16px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Colores de marca */
        .btn-call { background: #3b82f6; border: none; }
        .btn-wa { background: #25D366; border: none; }

        .btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }

        .icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .footer { margin-top: 35px; font-size: 10px; opacity: 0.5; letter-spacing: 3px; }
    </style>
</head>
