<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAPAS CONSTRUCTORES | Arq. Geovanny Vargas</title>
    <meta name="theme-color" content="#1d1d1b">
    <style>
        /* PALETA MAPAS CONSTRUCTORES */
        :root {
            --beige: #e2d1b5;       /* arena / fondo del logo */
            --beige-soft: rgba(226, 209, 181, 0.15);
            --charcoal: #1d1d1b;    /* negro carbón */
            --charcoal-2: #2b2a26;
            --stone: #7d7a74;       /* gris Moné Gardens */
        }

        /* RESET TOTAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* FONDO BLINDADO */
        .background-fix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('imgH/Fondo.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(29, 29, 27, 0.45) 0%, rgba(29, 29, 27, 0.85) 100%);
            z-index: -1;
        }

        body {
            background-color: var(--charcoal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .main-wrapper {
            width: 92%;
            max-width: 450px;
        }

        /* --- TARJETA DE PERFIL --- */
        .profile-card {
            background: rgba(29, 29, 27, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 209, 181, 0.25);
            border-radius: 35px;
            padding: 35px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid var(--beige);
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
            object-position: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: var(--beige);
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 26px;
            margin-bottom: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .tagline {
            color: var(--beige);
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .subtagline {
            color: rgba(255,255,255,0.55);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .divider {
            width: 50px;
            height: 1px;
            background: var(--beige);
            margin: 0 auto 25px;
            opacity: 0.6;
        }

        /* BOTONES VERTICALES */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            width: 100%;
        }

        .btn-call { background: var(--beige); color: var(--charcoal); border: none; }
        .btn-wa { background: #25D366; border: none; }
        .btn-linktree { background: var(--charcoal); border: 1px solid var(--beige); color: var(--beige); }
        .btn-email { background: var(--beige-soft); border: 1px solid rgba(226, 209, 181, 0.3); }
        .btn-instagram { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(225, 48, 108, 0.5); }
        .btn-web { background: rgba(125, 122, 116, 0.35); border: 1px solid rgba(255, 255, 255, 0.25); }
        .btn-save { background: #fff; color: var(--charcoal); border: none; }

        .btn-contact:active { transform: scale(0.97); }

        /* Estilo de Iconos */
        .icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .footer { text-align: center; color: rgba(255,255,255,0.3); padding: 40px 0; font-size: 9px; letter-spacing: 2px; }
    </style>
</head>
