<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIANA BLANCO DALEDIGITAL</title>
    <style>
        /* RESET GENERAL */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }

        body {
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            /* RUTA A TU CARPETA LOCAL img/ */
            background-image: url('https://stevencast556.github.io/CSM-NFC-CARDS/CLIENTE/DIANA_BLANCO_DALEDIGITAL/img/Fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 360px;
            background: #ffffff2b;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 35px;
            padding: 40px 25px;
            text-align: center;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }

        .profile-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #3b82f6, #00d4ff);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .profile-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid white;
            display: block;
            background-color: #222;
        }

        h1 { font-size: 26px; margin-bottom: 6px; font-weight: 700; }
        .profesion { 
            color: #d1d5db; 
            font-size: 14px; 
            margin-bottom: 30px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }

        .btn-group { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Colores de marca */
        .btn-call { background: #3b82f6; border: none; }
        .btn-wa { background: #25D366; border: none; }
        .btn-web { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-email { background: rgba(255, 255, 255, 0.08); }
        .btn-save { background: #fff; color: #000; font-weight: 700; margin-top: 5px; }

        .btn:active { transform: scale(0.96); opacity: 0.9; }

        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .footer { margin-top: 35px; font-size: 10px; opacity: 0.5; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <div class="profile-container">
            <img src="img/Perfil.jpeg" class="profile-img" alt="Foto">
        </div>

        <h1>ING. DIANA BLANCO</h1>
        <p class="profesion">DALEDIGITAL DISPOSITIVOS S.A.S</p>

        <div class="btn-group">
            <!-- LLAMAR -->
            <a href="tel:+593989341072" class="btn btn-call">
                <svg class="icon" viewBox="0 0 24 24"><path d="M6.62 10.79a15.15 15.15 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                Llamar ahora
            </a>

            <!-- WHATSAPP -->
            <a href="https://wa.me/593989341072" class="btn btn-wa">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.81 9.81 0 0012.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 012.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.188 8.188 0 01-1.26-4.38c.01-4.54 3.7-8.24 8.25-8.24M8.53 8.07c-.13 0-.34.05-.52.24-.18.19-.69.67-.69 1.63s.7 1.89.8 2.03c.1.13 1.37 2.09 3.32 2.93.46.2.83.32 1.11.41.47.15.89.13 1.22.08.38-.05 1.17-.48 1.33-.94.16-.47.16-.86.11-.94-.05-.09-.18-.13-.38-.24s-1.17-.57-1.35-.64c-.18-.08-.31-.11-.45.09-.13.19-.52.64-.64.78-.11.13-.24.15-.44.05-.2-.1-1-.37-1.91-1.18-.71-.63-1.19-1.41-1.33-1.65-.13-.24-.01-.37.09-.47.09-.09.2-.24.3-.35.1-.11.13-.19.19-.32.07-.13.03-.25-.02-.35-.05-.09-.45-1.09-.62-1.5-.17-.4-.35-.35-.47-.35z"/></svg>
                WhatsApp

            <!-- SITIO WEB (NUEVO) -->
            <a href="https://daledigital.net/" target="_blank" class="btn btn-web">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                Sitio Web
            </a>

            <!-- CORREO -->
            <a href="mailto:ventas@daledigital.net" class="btn btn-email">
                <svg class="icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>

            <!-- GUARDAR -->
            <button onclick="saveVCard()" class="btn btn-save">
                <svg class="icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Guardar Contacto
            </button>
        </div>

        <p class="footer">DALEDIGITAL DISPOSITIVOS S.A.S</p>
        <p class="footer">POWERED BY CSM-SMART-CARDS</p>
    </div>

    <script>
        function saveVCard() {
            const nombre = "Ing. Diana Blanco";
            const tel = "+593989341072";
            const email = "ventas@daledigital.net";
            const web = "https://daledigital.net/"; // Web para la vCard

            const vcard = "BEGIN:VCARD\n" +
                          "VERSION:3.0\n" +
                          "FN:" + nombre + "\n" +
                          "TITLE:Daledigital Dispositivos\n" +
                          "TEL;TYPE=CELL:" + tel + "\n" +
                          "EMAIL:" + email + "\n" +
                          "URL:" + web + "\n" + // Incluye la web en el contacto
                          "END:VCARD";
            
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = nombre.replace(" ", "_") + ".vcf";
            a.click();
        }
    </script>
</body>
</html>
