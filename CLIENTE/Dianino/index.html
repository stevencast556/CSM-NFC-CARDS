    <title>Para Melanny 🌷</title>
    <style>

        body {
            margin: 0;
            background-color: #050505;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }

        canvas {
            display: block;
        }

            bottom: 10%;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

            font-size: 1.8rem;
            margin: 0;
            color: #ffb7c5;
            text-shadow: 0 0 15px rgba(255, 183, 197, 0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: all 2s ease-in-out;
        }

        .name {
            display: block;
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: 8px;
            color: #ffffff;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 2s ease-in-out;
            transition-delay: 1s;
        }

        .visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

        const img = new Image();
        img.src = imageBase64;

        class Particle {
            constructor(x, y, color, targetX, targetY) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.color = color;
                this.targetX = targetX;
                this.targetY = targetY;
                this.size = 1.5;
                this.velocity = Math.random() * 0.05 + 0.02;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
            update() {
                this.x += (this.targetX - this.x) * this.velocity;
                this.y += (this.targetY - this.y) * this.velocity;
            }
        }

        img.onload = function() {
            // Calcular escala para que la foto no se deforme y quepa en pantalla
            const scale = Math.min(canvas.width / img.width * 0.8, canvas.height / img.height * 0.6);
            const w = img.width * scale;
            const h = img.height * scale;
            const xOffset = (canvas.width - w) / 2;
            const yOffset = (canvas.height - h) / 2 - 50;

            // Dibujar temporalmente para extraer datos
            ctx.drawImage(img, xOffset, yOffset, w, h);
            const imageData = ctx.getImageData(xOffset, yOffset, w, h).data;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Analizar píxeles de la imagen
            for (let y = 0; y < h; y += gap) {
                for (let x = 0; x < w; x += gap) {
                    const index = (y * Math.floor(w) + x) * 4;
                    const r = imageData[index];
                    const g = imageData[index + 1];
                    const b = imageData[index + 2];
                    const a = imageData[index + 3];

                    if (a > 128) { // Si el píxel no es transparente
                        const color = `rgb(${r},${g},${b})`;
                        particles.push(new Particle(0, 0, color, xOffset + x, yOffset + y));
                    }
                }
            }

            // Mostrar textos después de que empiece la animación
            setTimeout(() => {
                document.getElementById('title').classList.add('visible');
                document.getElementById('name').classList.add('visible');
            }, 1500);

            animate();
        };

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)'; // Efecto rastro suave
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            location.reload(); 
        });
    </script>
