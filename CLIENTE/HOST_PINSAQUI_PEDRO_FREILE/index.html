
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOSTERIA HACIENDA PINSAQUI</title>
    <style>
        /* RESET TOTAL */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }

        /* FONDO BLINDADO */
        .background-fix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://stevencast556.github.io/CSM-NFC-CARDS/CLIENTE/HOST_PINSAQUI_PEDRO_FREILE/imgH/Fondo.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .main-wrapper {
            width: 92%;
            max-width: 450px;
        }

        /* --- TARJETA DE PERFIL --- */
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 35px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #202b86; 
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
            object-position: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: white;
        }

        h1 { font-size: 24px; margin-bottom: 5px; font-weight: 700; letter-spacing: -0.5px; }
        .tagline { 
            color: #202b86; 
            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            font-weight: 700; 
        }

        /* BOTONES VERTICALES */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-call { background: #3b82f6; border: none; }
        .btn-wa { background: #25D366; border: none; }
        .btn-email { background: rgba(255, 255, 255, 0.15); }
        .btn-instagram { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(225, 48, 108, 0.5); }
        .btn-facebook { background: rgba(24, 119, 242, 0.2); border: 1px solid rgba(24, 119, 242, 0.5); }
        .btn-tiktok { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-web { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); }
        .btn-save { background: #fff; color: #000; }

        .btn-contact:active { transform: scale(0.97); }
        
        /* Estilo de Iconos */
        .icon { 
            width: 22px; 
            height: 22px; 
            fill: currentColor; 
        }

        .footer { text-align: center; color: rgba(255,255,255,0.3); padding: 40px 0; font-size: 9px; letter-spacing: 2px; }
    </style>
</head>
