<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TREO | Camilo Osorio</title>
    <meta name="theme-color" content="#14241e">
    <style>
        /* PALETA TREO (tomada de treo.lat) */
        :root {
            --green: #14241e;   /* verde bosque profundo */
            --accent: #2e654b;  /* verde acento */
            --ink: #1b2821;     /* tinta */
            --muted: #5c6a60;
            --paper: #f8faf7;   /* papel */
            --rule: #d9e2da;
        }

        /* RESET TOTAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* FONDO BLINDADO */
        .background-fix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--green);
            background-image: url('imgCO/Fondo.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 36, 30, 0.25);
            z-index: -1;
        }

        body {
            background-color: var(--green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .main-wrapper {
            width: 92%;
            max-width: 450px;
        }

        /* --- TARJETA DE PERFIL --- */
        .profile-card {
            background: rgba(248, 250, 247, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(217, 226, 218, 0.22);
            border-radius: 28px;
            padding: 35px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--paper);
            margin: 0 auto 18px;
            display: block;
            object-fit: cover;
            object-position: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: var(--paper);
        }

        h1 { font-size: 26px; margin-bottom: 6px; font-weight: 640; letter-spacing: -0.5px; }
        .role {
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            margin-bottom: 14px;
        }
        .tagline {
            display: inline-block;
            color: #9fd0b5;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 600;
            margin-bottom: 26px;
            padding: 6px 12px;
            border: 1px solid rgba(159, 208, 181, 0.35);
            border-radius: 999px;
        }

        /* BOTONES VERTICALES */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            width: 100%;
        }

        .btn-call { background: var(--paper); color: var(--ink); border: none; }
        .btn-wa { background: #25D366; border: none; }
        .btn-email { background: var(--accent); border: none; }
        .btn-instagram { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(225, 48, 108, 0.5); }
        .btn-web { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(217, 226, 218, 0.35); }
        .btn-save { background: #fff; color: var(--ink); border: none; }

        .btn-contact:active { transform: scale(0.97); }

        /* Estilo de Iconos */
        .icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .quote { margin-top: 26px; color: rgba(255,255,255,0.6); font-size: 13px; font-style: italic; }
        .footer { text-align: center; color: rgba(255,255,255,0.3); padding: 40px 0; font-size: 9px; letter-spacing: 2px; }
    </style>
</head>
