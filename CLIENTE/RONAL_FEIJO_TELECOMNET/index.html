<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RONAL FEIJO TELECOMNET</title>
    <style>
        /* RESET TOTAL */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }

        /* FONDO BLINDADO PARA MÓVILES */
        .background-fix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://stevencast556.github.io/CSM-NFC-CARDS/CLIENTE/RONAL_FEIJO_TELECOMNET/imgRF/Fondo.jpeg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .main-wrapper {
            width: 92%;
            max-width: 450px;
        }

        /* --- TARJETA DE PERFIL --- */
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 40px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .profile-img {
            width: 85%;           /* Ocupa todo el ancho disponible de la tarjeta */
            height: auto;         /* Altura fija para mantener el rectangulo constante */
            border-radius: 20px;   /* Esquinas redondeadas suaves, no circulares */
            border: 2px solid rgba(255, 255, 255, 0.1); 
            margin: 0 auto 20px;
            display: block;
            object-fit: cover;     /* La foto llena el recuadro sin estirarse */
            object-position: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: rgba(255,255,255,0.05);
        }

        h1 { font-size: 24px; margin-bottom: 5px; font-weight: 700; letter-spacing: -0.5px; color: #182cd9}
        h2 { font-size: 16px; margin-bottom: 5px; font-weight: 500; letter-spacing: -0.5px; color: #182cd9}
        .tagline { 
            color: #182cd9; 
            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 50px; 
            font-weight: 700; 
        }

        /* BOTONES EN COLUMNA (VERTICAL) */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Colores de botones */
        .btn-call { background: #3b82f6; border: none; }
        .btn-wa { background: #25D366; border: none; }
        .btn-web { background: #1a2bc9; border: none; }
        .btn-email { background: rgba(255, 255, 255, 0.15); }
        .btn-instagram { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(225, 48, 108, 0.5); }
        .btn-pdf { background: #f39c12; border: none; }
        .btn-tiktok { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-save { background: #fff; color: #000; font-weight: 700; }

        .btn-contact:active { transform: scale(0.97); }
        
        /* Estilo de Iconos */
        .icon { 
            width: 22px; 
            height: 22px; 
            fill: currentColor; 
        }

        .footer { text-align: center; color: rgba(255,255,255,0.3); padding: 40px 0; font-size: 9px; letter-spacing: 2px; }
    </style>
</head>

        <p class="footer">POWERED BY CSM-SMART-CARDS</p>

    <script>
        function saveContact() {
            // Variable para foto Base64 opcional en el vCard
            const FOTO_BASE64 = ""; 
            let photoVCard = "";
            if (FOTO_BASE64.includes(",")) {
                photoVCard = FOTO_BASE64.split(",")[1];
            }

            const vcard = "BEGIN:VCARD\n" +
                          "VERSION:3.0\n" +
                          "FN:RONAL FEIJO\n" +
                          "ORG:TELECOMNET\n" +
                          "TITLE:Técnico Telecomnet\n" +
                          "TEL;TYPE=CELL:+593986964520\n" +
                          "END:VCARD";
            
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Ronal_Feijo.vcf";
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
