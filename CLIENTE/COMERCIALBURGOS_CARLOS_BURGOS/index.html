        .tagline {

            font-weight: 700; 
        }

        }

            justify-content: center;
            gap: 12px;
            padding: 16px;

            text-decoration: none;

        .btn-save { background: #fff; color: #000; font-weight: 700; }

        .btn-contact:active { transform: scale(0.97); }
        
        /* Estilo de Iconos */
        .icon {

            height: 20px;

            display: block;
