    <style>
        /* RESET TOTAL PARA EVITAR DESPLAZAMIENTOS */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #3b82f6;
            --card-glass: rgba(255, 255, 255, 0.1);
            --border-glass: rgba(255, 255, 255, 0.2);
        }

        /* CUERPO CENTRADO DINÁMICO */
        body {
            /* Usamos dvh (Dynamic Viewport Height) para que siempre esté centrado en celular */
            height: 100vh;
            height: 100dvh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* Fondo base */
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            overflow: hidden; /* Evita que el fondo cree scroll innecesario */
            position: relative;
        }

        /* CAPA OSCURA DE CONTRASTE TOTALMENTE FIJA */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* TARJETA TOTALMENTE CENTRADA */
        .card {
            position: relative;
            z-index: 10; /* Por encima del overlay */
            width: 90%;
            max-width: 360px;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            /* Animación de entrada */
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ELEMENTOS INTERNOS */
        .profile-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 3px solid white;
            overflow: hidden;
            background: #222;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { font-size: 24px; margin-bottom: 6px; font-weight: 700; letter-spacing: -0.5px; }
        .profesion { color: #d1d5db; font-size: 14px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1.5px; }

        /* BOTONES */
        .btn-group { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
            border: none;
            display: block;
            width: 100%;
        }

        .btn-alt {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border-glass);
        }

        .btn:active { transform: scale(0.96); }

    </style>
</head>
