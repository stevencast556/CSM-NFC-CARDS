        /* --- TARJETA DE PERFIL --- */
        .profile-card {

            margin-bottom: 25px;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);

        .profile-img {

            height: 160px;

            border: 4px solid #ad1c1c; 
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
            object-position: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: white;
        }

        h1 { font-size: 24px; margin-bottom: 5px; font-weight: 700; letter-spacing: -0.5px; }
        .tagline {

            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            font-weight: 700; 
        }

        /* BOTONES VERTICALES */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);

        .btn-wa { background: #25D366; border: none; }
        .btn-email { background: rgba(255, 255, 255, 0.15); }
        .btn-instagram { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(225, 48, 108, 0.5); }
        /* Estilo para TikTok */
        .btn-tiktok { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-save { background: #fff; color: #000; }

        .btn-contact:active { transform: scale(0.97); }
        .icon { width: 20px; height: 20px; fill: currentColor; }

        /* --- SECCIÓN DE VIDEO --- */
        .video-title {
            text-align: center;
            color: white;
            margin: 30px 0 20px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 300;

        .video-container {

            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            line-height: 0;
            margin-bottom: 20px;
        }

        video {

            height: auto;
            display: block;
        }
