<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> LISDELYS GONZÁLES - DYC PROJECTS </title>
    <style>
        /* RESET TOTAL */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }

        /* FONDO BLINDADO */
        .background-fix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://stevencast556.github.io/CSM-NFC-CARDS/CLIENTE/DYCPROYECTS_LISDELYS_GONZALES/imgDY/Fondo.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centra la tarjeta verticalmente */
            padding: 20px 0;
        }

        .main-wrapper {
            width: 92%;
            max-width: 450px;
        }

        /* --- TARJETA DE PERFIL --- */
        .profile-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 35px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #FFD700; 
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
            object-position: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: white;
        }

        h1 { font-size: 24px; margin-bottom: 5px; font-weight: 700; letter-spacing: -0.5px; }
        .tagline { 
            color: #FFD700; 
            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            font-weight: 700; 
        }

        /* BOTONES VERTICALES */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-call { background: #3b82f6; border: none; }
        .btn-wa { background: #25D366; border: none; }
        .btn-email { background: rgba(255, 255, 255, 0.15); }
        .btn-instagram { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(225, 48, 108, 0.5); }
        .btn-tiktok { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-web { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); }
        .btn-save { background: #fff; color: #000; }

        .btn-contact:active { transform: scale(0.97); }
        .icon { width: 20px; height: 20px; fill: currentColor; }

        .footer { text-align: center; color: rgba(255,255,255,0.3); padding: 40px 0; font-size: 9px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="background-fix"></div>
    <div class="overlay"></div>

    <div class="main-wrapper">
        
        <div class="profile-card">
            <!-- FOTO CIRCULAR -->
            <img src="imgDY/Perfil.jpeg" class="profile-img" alt="Perfil">
            <h1>LISDELYS GONZÁLES</h1>
            <p class="tagline">GERENTE GENERAL DYC PROJECTS</p>

            <div class="contact-list">
                <a href="tel:+593962605981" class="btn-contact btn-call">Llamar ahora</a>
                <a href="https://wa.me/593962605981" class="btn-contact btn-wa">WhatsApp</a>
                <a href="mailto:DyCprojects31@gmail.com" class="btn-contact btn-email">Correo</a>
                <a href="https://www.instagram.com/dycprojects?igsi=MWpiMXZiMDhkMzFlcg==" target="_blank" class="btn-contact btn-instagram">Instagram</a>
                <a href="h" target="_blank" class="btn-contact btn-tiktok">TikTok</a>

                <button onclick="saveContact()" class="btn-contact btn-save">
                    GUARDAR CONTACTO
                </button>
            </div>
        </div>

        <p class="footer">POWERED BY CSM-SMART-CARDS</p>
    </div>

    <script>
        function saveContact() {
            // ============================================================
            // PEGA AQUÍ TU CÓDIGO BASE64 DE LA FOTO DE PERFIL
            // ============================================================
            const FOTO_BASE64 = "TU_CODIGO_BASE64_AQUI"; 

            let photoVCard = "";
            if (FOTO_BASE64.includes(",")) {
                photoVCard = FOTO_BASE64.split(",")[1];
            }

            const vcard = "BEGIN:VCARD\n" +
                          "VERSION:3.0\n" +
                          "FN:Lisdelys Gonzáles\n" +
                          "ORG:DyC Proyects\n" +
                          "TITLE:GERENTE GENERAL\n" +
                          "TEL;TYPE=CELL:+593962605981\n" +
                          "EMAIL:DyCprojects31@gmail.com\n" +
                          "PHOTO;ENCODING=b;TYPE=JPEG:" + photoVCard + "\n" +
                          "END:VCARD";
            
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Lisdelys_Gonzáles.vcf";
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
