<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> CONSULT PIE MENA DOS </title>
    <style>
        /* RESET TOTAL */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }

        /* FONDO BLINDADO */
        .background-fix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://stevencast556.github.io/CSM-NFC-CARDS/CLIENTE/FABRICIO_CALDERON_CONSULTPIE/imagenFC/Fondo.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .main-wrapper {
            width: 92%;
            max-width: 450px;
        }

        /* --- TARJETA DE PERFIL --- */
        .profile-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            margin: 0 auto 15px;
            object-fit: cover;
            display: block;
        }

        h1 { font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        .tagline { 
            color: #3b82f6; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 20px; 
            font-weight: 600; 
        }

        /* CUADRÍCULA DE CONTACTO */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-contact {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 18px;
            font-size: 11px;
            transition: 0.3s;
        }

        .btn-wa { background: #25D366; border: none; }
        .btn-call { background: #3b82f6; border: none; }
        .btn-fb { background: #1877F2; border: none; }
        .btn-tk { background: #000000; border: 1px solid rgba(255,255,255,0.2); }

        .btn-map { 
            grid-column: span 2; 
            background: #ea4335; 
            border: none;
            flex-direction: row; 
            gap: 10px;
            font-weight: 700;
            font-size: 13px;
        } 

        .btn-save { 
            grid-column: span 2; 
            background: #fff; 
            color: #000; 
            font-weight: 700; 
            flex-direction: row; 
            gap: 10px; 
            font-size: 13px;
            margin-top: 5px;
        }

        .icon { width: 18px; height: 18px; fill: currentColor; }

        /* --- CATÁLOGO CORREGIDO --- */
        .catalog-title {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 300;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            display: flex;
            flex-direction: column;
        }

        /* CONTENEDOR DE IMAGEN MEJORADO */
        .product-img-container {
            width: 100%;
            height: 180px; /* Altura fija para que todas las cajas sean iguales */
            background-color: rgba(255, 255, 255, 0.05); /* Fondo suave */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px; /* Espacio para que la imagen no toque los bordes si es muy grande */
        }

        .product-img { 
            max-width: 100%;
            max-height: 100%;
            /* 'contain' hace que la imagen se adapte al recuadro sin cortarse */
            object-fit: contain; 
            display: block;
        }

        .product-info { 
            padding: 12px; 
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .p-name { 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 8px; 
            min-height: 34px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .p-price { font-size: 16px; color: #25D366; font-weight: 800; margin-bottom: 10px; }

        .btn-order {
            display: block;
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 11px;
        }

        .footer { text-align: center; color: rgba(255,255,255,0.3); padding: 40px 0; font-size: 9px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="background-fix"></div>
    <div class="overlay"></div>

    <div class="main-wrapper">
        
        <div class="profile-card">
            <img src="imagenFC/perfil.png" class="profile-img" alt="Perfil">
            <h1>POD. FABRICIO CALDERON</h1>
            <p class="tagline">CONSULT PIE MENA DOS</p>

            <div class="contact-grid">
                <a href="tel:+593987745441" class="btn-contact btn-call">Llamar</a>
                <a href="https://wa.me/593987745441" class="btn-contact btn-wa">WhatsApp</a>
                <a href="https://www.facebook.com/profile.php?id=100083508032951" class="btn-contact btn-fb">Facebook</a>
                <a href="https://tiktok.com/@ConsultPie" class="btn-contact btn-tk">TikTok</a>
                <a href="mailto:consultpie.3.c@gmail.com" class="btn-contact">Correo</a>
                <a href="https://www.instagram.com/consultpie.ec?igsh=MWExeHJuMGFtMDE1" class="btn-contact">Instagram</a>
                <a href="https://maps.app.goo.gl/DeDfJHxKMhfYj4tF8?g_st=awb" class="btn-contact btn-map">Nuestra Ubicación</a>
                <button onclick="saveContact()" class="btn-contact btn-save">GUARDAR CONTACTO</button>
            </div>
        </div>

        <h2 class="catalog-title">Nuestros Productos</h2>
        
        <div class="product-list">
            <!-- Producto 1 -->
            <div class="product-card">
                <div class="product-img-container">
                    <img src="imagenFC/Hongos.jpg" class="product-img" alt="Hongos">
                </div>
                <div class="product-info">
                    <div class="p-name">Tratamiento de Hongos</div>
                    <div class="p-price">$35.00</div>
                    <a href="https://wa.me/593987745441?text=Me interesa el tratamiento de Hongos" class="btn-order">Comprar</a>
                </div>
            </div>

            <!-- Producto 2 -->
            <div class="product-card">
                <div class="product-img-container">
                    <img src="img/P2_Tarjetas.jpg" class="product-img" alt="Tarjeta">
                </div>
                <div class="product-info">
                    <div class="p-name">Tarjeta Negocio</div>
                    <div class="p-price">$25.00</div>
                    <a href="https://wa.me/593987745441?text=Me interesa la Tarjeta Negocio" class="btn-order">Comprar</a>
                </div>
            </div>
            <!-- Puedes seguir agregando productos con la misma estructura -->
        </div>

        <p class="footer">POWERED BY CSM-SMART-CARDS</p>
    </div>

    <script>
        function saveContact() {
            const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:Fabricio Calderon\nORG:CONSULT PIE PODOLOGIA\nTEL:+593987745441\nEND:VCARD";
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Contacto.vcf";
            a.click();
        }
    </script>
</body>
</html>
